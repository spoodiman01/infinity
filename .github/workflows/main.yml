name: CI for QuizBots

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  mail: ${{ secrets.GITHUBMAIL }}
  username: ${{ secrets.GITHUBNAME }}
  ACTIONS_RUNNER_DEBUG: true
  ACTIONS_STEP_DEBUG: true

  # Optional overrides for core/config.py defaults.
  # Uncomment and add the matching repository secrets to override the values
  # that are already embedded as defaults in core/config.py. If a secret is
  # missing/empty it would override the default with "" — so only enable
  # lines for secrets you have actually set.
  # BOT_TOKEN: ${{ secrets.POLL_BOT_TOKEN }}
  # API_ID: ${{ secrets.API_ID }}
  # API_HASH: ${{ secrets.API_HASH }}
  # GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
  # MONGODB_URI: ${{ secrets.MONGODB_URI }}
  # LOG_CHANNEL: ${{ secrets.LOG_CHANNEL }}
  # DUMP2_CHANNEL: ${{ secrets.DUMP2_CHANNEL }}
  # DEMO_CHAT_ID: ${{ secrets.DEMO_CHAT_ID }}
  # PDF_OWNER_ID: ${{ secrets.PDF_OWNER_ID }}

jobs:
  quizbot:
    name: POLL-Bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Clone repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPOSLUG: ${{ secrets.REPOSLUG }}
          GH_USERNAME: ${{ env.username }}
        run: |
          git clone "https://${GH_USERNAME}:${GH_TOKEN}@github.com/${REPOSLUG}.git" poll

          echo "Cloned repository:"
          ls -la "$GITHUB_WORKSPACE/poll"

          test -f "$GITHUB_WORKSPACE/poll/requirements.txt" || {
            echo "::error::requirements.txt not found in cloned repository"
            exit 1
          }

          test -f "$GITHUB_WORKSPACE/poll/bot.py" || {
            echo "::error::bot.py not found in cloned repository"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-data \
            libpoppler-dev \
            poppler-utils \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libpangocairo-1.0-0 \
            libglib2.0-0 \
            libcairo2 \
            fonts-noto-core \
            fonts-noto-ui-core

          python -m pip install --upgrade pip
          python -m pip install -r "$GITHUB_WORKSPACE/poll/requirements.txt"

      - name: Run POLL Bot
        run: |
          cd "$GITHUB_WORKSPACE/poll"
          xvfb-run -a python bot.py
        timeout-minutes: 340
        continue-on-error: true


  looper:
    name: Run QuizBot loop
    needs: quizbot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Git Configs
        run: |
          git config --global user.email "${{ env.mail }}"
          git config --global user.name "${{ env.username }}"
          git config --global pull.rebase false

      - name: Create empty commit loop
        run: |
          git clone https://${{ secrets.GH_TOKEN }}@github.com/${GITHUB_REPOSITORY} temp
          cd temp
          git commit --allow-empty -m "Re-run workflow"
          git push origin master
